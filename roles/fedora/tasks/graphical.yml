---
- name: enable copr repos
  community.general.copr:
    name: "{{ item }}"
  become: true
  with_items: "{{ fedora_copr_repos }}"
- name: install graphical packages
  ansible.builtin.dnf:
    name: "{{ fedora_graphical_pkgs }}"
  become: true
- name: enable systemctl user services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    scope: user
    enabled: true
  with_items:
    - conky
    - waybar
- name: create Kvantum config directory
  ansible.builtin.file:
    path: ~/.config/Kvantum
    state: directory
    mode: "0755"
- name: symlink Kvantum config file
  ansible.builtin.file:
    path: ~/.config/Kvantum/kvantum.kvconfig
    src: "{{ ansible_env.PWD }}/roles/graphical/files/kvantum.kvconfig"
    state: link
- name: clone KvLibadwaita Kvantum style theme
  ansible.builtin.git:
    repo: https://github.com/GabePoel/KvLibadwaita.git
    dest: ~/.cache/dburke/KvLibadwaita
    version: main
  notify: copy KvLibadwaita files
