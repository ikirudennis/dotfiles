---
- name: symlink conky directory
  ansible.builtin.file:
    path: ~/.config/conky
    src: "{{ ansible_facts['env'].PWD }}/roles/graphical/files/conky"
    state: link
- name: enable conky.service systemd unit file
  vars:
    service_path: "{{ graphical_conky_service_path }}"
  # noqa command-instead-of-module command-instead-of-shell
  ansible.builtin.shell:
    cmd: "systemctl --user link {{ ansible_facts['env'].PWD }}/{{ service_path }}" # noqa: yaml[line-length]
    creates: "~/.config/systemd/user/conky.service"
  register: graphical_conky_systemctl_result
  changed_when: "graphical_conky_systemctl_result.rc != 0"
- name: symlink dunst directory
  ansible.builtin.file:
    path: ~/.config/dunst
    src: "{{ ansible_facts['env'].PWD }}/roles/graphical/files/dunst"
    state: link
- name: symlink foot directory
  ansible.builtin.file:
    path: ~/.config/foot
    src: "{{ ansible_facts['env'].PWD }}/roles/graphical/files/foot"
    state: link
- name: create labwc directory
  ansible.builtin.file:
    path: ~/.config/labwc
    state: directory
    mode: "0755"
- name: create systemd environment.d directory
  ansible.builtin.file:
    path: ~/.config/environment.d
    state: directory
    mode: "0755"
- name: symlink labwc files
  ansible.builtin.file:
    path: "~/.config/labwc/{{ item }}"
    src: "{{ ansible_facts['env'].PWD }}/roles/graphical/files/labwc/{{ item }}"
    state: link
  with_items: "{{ graphical_labwc_files }}"
- name: symlink labwc environment file
  ansible.builtin.file:
    path: "~/.config/environment.d/10-graphical.conf"
    src: "{{ ansible_facts['env'].PWD }}/roles/graphical/files/systemd/10-graphical.conf" # noqa: yaml[line-length]
    state: link
- name: symlink labwc_exit script
  ansible.builtin.file:
    path: "~/.local/bin/labwc_exit"
    src: "{{ ansible_facts['env'].PWD }}/roles/graphical/files/labwc_exit" # noqa: yaml[line-length]
    state: link
- name: link labwc-session.target systemd unit file
  # noqa command-instead-of-module command-instead-of-shell
  ansible.builtin.shell:
    cmd: "systemctl --user link {{ ansible_facts['env'].PWD }}/{{ graphical_lst_path }}" # noqa: yaml[line-length]
    creates: "~/.config/systemd/user/labwc-session.target"
  register: graphical_lst_systemctl_result
  changed_when: "graphical_lst_systemctl_result.rc != 0"
- name: ensure nerdfont directory exists before we put files in it
  ansible.builtin.file:
    dest: "{{ graphical_nerdfont_dest }}"
    state: directory
    mode: "0755"
- name: install nerdfont
  ansible.builtin.unarchive:
    src: "{{ graphical_nerdfont_download_url }}"
    dest: "{{ graphical_nerdfont_dest }}"
    remote_src: true
  notify: clean up old nerdfonts
- name: symlink swayidle directory
  ansible.builtin.file:
    path: ~/.config/swayidle
    src: "{{ ansible_facts['env'].PWD }}/roles/graphical/files/swayidle"
    state: link
- name: symlink swaylock directory
  ansible.builtin.file:
    path: ~/.config/swaylock
    src: "{{ ansible_facts['env'].PWD }}/roles/graphical/files/swaylock"
    state: link
- name: ensure the terminator config directory exists
  ansible.builtin.file:
    path: ~/.config/terminator
    state: directory
    mode: "0755"
- name: symlink terminator config
  ansible.builtin.file:
    path: ~/.config/terminator/config
    src: "{{ ansible_facts['env'].PWD }}/roles/graphical/files/terminator/config" # noqa: yaml[line-length]
    state: link
    mode: "0644"
- name: symlink waybar directory
  ansible.builtin.file:
    path: ~/.config/waybar
    src: "{{ ansible_facts['env'].PWD }}/roles/graphical/files/waybar"
    state: link
- name: symlink wlogout directory
  ansible.builtin.file:
    path: ~/.config/wlogout
    src: "{{ ansible_facts['env'].PWD }}/roles/graphical/files/wlogout"
    state: link
- name: symlink fuzzel directory
  ansible.builtin.file:
    path: ~/.config/fuzzel
    src: "{{ ansible_facts['env'].PWD }}/roles/graphical/files/fuzzel"
    state: link
